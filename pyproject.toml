[project]
name = "rag-kb"
version = "0.1.0"
description = "MCP server: local folder as a searchable knowledge base (Corrective RAG on LangGraph, hybrid BM25 + vector search)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastembed>=0.9.0",
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "langchain-classic>=1.0.8",
    "langchain-core>=1.6.9",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=3.1.1",
]

[project.scripts]
rag-kb = "rag_kb.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_kb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Bilingual (RU/EN) project: Cyrillic in strings and comments is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
